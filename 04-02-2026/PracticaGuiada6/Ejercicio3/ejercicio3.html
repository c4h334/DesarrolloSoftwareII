<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      p {
        color: red;
      }
      .note {
        font-size: 20px;
      }
      #id-selector-demo {
        color: green;
      }
      [value="4"] {
        color: blue;
      }
      * {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Title</h1>
    <p class="note">Grande</p>
    <p id="id-selector-demo">Verde</p>
    <ul>
      <li value="4">Elemento</li>
    </ul>
  </body>
</html>
